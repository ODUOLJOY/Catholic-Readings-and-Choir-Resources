services:
  - type: web
    name: catholic-readings-and-choir-resource-app
    runtime: python
    plan: starter
    # The free plan auto-suspends the service after 15 minutes of inactivity.
    # When suspended, Render's edge returns a bare 503 (x-render-routing:
    # suspend) with NO CORS headers, which the browser reports as a CORS
    # fault. 429 rate-limit errors and 502 cold-start failures are also
    # caused by the free tier's resource limits. The starter plan stays
    # awake and has substantially higher rate limits, which fixes the CORS,
    # 503, 502 and 429 errors experienced by the Vercel frontend.

    rootDir: backend

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    # Startup validates the schema and the permission grants, and refuses to serve
    # traffic without them. Both checks are read-only: nothing here creates tables,
    # runs migrations, or inserts grants, because an implicit create_all on boot is
    # an unreviewed production migration that runs on every deploy. `&&` is
    # required -- without it a failed check would fall through to Uvicorn and start
    # against the very state that was just reported as unusable, which is how these
    # 500s reached production.
    #
    # The permission check is per-role, not a total count: a partially seeded
    # database leaves an administrator unable to act while a count-only check
    # still reports success.
    #
    # Provisioning is a separate, explicitly approved step, in this order:
    #   python -m app.services.schema_bootstrap
    #   python -m app.services.permission_seed
    startCommand: |
      python -m app.services.schema_bootstrap --check && python -m app.services.permission_seed --check && python -m app.bootstrap_super_admin && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    autoDeploy: true

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5

      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        sync: false

      - key: AUTO_CREATE_TABLES
        value: "false"

      - key: BOOTSTRAP_SUPER_ADMIN_EMAIL
        value: parmenasoduol1318@gmail.com

      - key: BOOTSTRAP_SUPER_ADMIN_PASSWORD
        sync: false

      - key: SCHEDULED_JOB_TOKEN
        sync: false

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"

      - key: ENVIRONMENT
        value: production

      - key: FRONTEND_URL
        value: https://catholic-readings-and-choir-resourc.vercel.app

      # Google Sign-In credentials. ID/secret are platform secrets and must be
      # supplied in the Render dashboard (they are intentionally not committed).
      # The redirect URI is derived from FRONTEND_URL in code
      # (services/google_auth.allowed_redirect_uris), so the production
      # `<FRONTEND_URL>/auth/google` callback is accepted automatically once
      # GOOGLE_CLIENT_ID is set.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://catholic-readings-and-choir-resourc.vercel.app/auth/google

      # Explicit browser origins allowed to call this API with credentials.
      # Only deployed origins are listed: the local Expo web origin is matched
      # separately by `app.core.config.LOOPBACK_ORIGIN_RE`, which accepts any
      # loopback port. Pinned loopback ports here were unreliable because Expo
      # takes the next free port when the previous one is busy, so a dev server
      # on 8082 was rejected and every request failed as a CORS error.
      - key: ALLOWED_ORIGINS
        value: >-
          ["https://stellular-clafoutis-ad641c.netlify.app",
          "https://catholic-readings-and-choir-resourc.vercel.app",
          "http://localhost:8081",
          "http://127.0.0.1:8081",
          "http://localhost:19006",
          "http://127.0.0.1:19006",
          "http://localhost:3000"]

      - key: MPESA_ENVIRONMENT
        value: production

      - key: MPESA_CONSUMER_KEY
        sync: false

      - key: MPESA_CONSUMER_SECRET
        sync: false

      - key: MPESA_PASSKEY
        sync: false

      - key: MPESA_SHORTCODE
        sync: false

      - key: MPESA_CALLBACK_URL
        value: https://catholic-readings-and-choir-resource-app.onrender.com/api/payments/mpesa/callback

      - key: MPESA_ACCOUNT_REFERENCE
        value: CatholicReadings

      - key: MPESA_TRANSACTION_DESCRIPTION
        value: Catholic Readings Subscription

      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline

      - key: MPESA_MONTHLY_AMOUNT
        value: "10"

      - key: MPESA_RECIPIENT_NUMBER
        value: "0748153302"